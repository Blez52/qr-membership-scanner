<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Membership — Сканер</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #182230;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; text-align: center; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #1769e0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #stopButton { background: #667085; }

    #reader {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #eef2f7;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
      font-size: 17px;
    }

    .success { background: #dcfce7 !important; color: #166534; }
    .error   { background: #fee2e2 !important; color: #991b1b; }

    .hint { color: #667085; font-size: 14px; line-height: 1.5; }
  </style>
</head>

<body>
  <div class="container">
    <h2>QR Membership</h2>

    <p class="hint">Введите PIN администратора и нажмите «Начать сканирование».</p>

    <input type="password" id="pin" placeholder="PIN администратора"
           inputmode="numeric" autocomplete="off">

    <button id="startButton" onclick="startScanner()">Начать сканирование</button>
    <button id="stopButton" onclick="stopScanner()" disabled>Остановить камеру</button>

    <div id="reader"></div>

    <div id="result">Ожидание сканирования QR-кода</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxwwCjRbsbEEitckhPzRGmnJEu6DHvVb85anT2-hboTeaPLSKW4sIeYoNJ1ioy2R_h3/exec';

    let scanner = null;
    let isScanning = false;
    let isSending = false;

    const pinInput = document.getElementById('pin');
    const resultBox = document.getElementById('result');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    try { pinInput.value = localStorage.getItem('qr_pin') || ''; } catch (e) {}
    pinInput.addEventListener('change', () => {
      try { localStorage.setItem('qr_pin', pinInput.value.trim()); } catch (e) {}
    });

    function showResult(message, type) {
      resultBox.className = type || '';
      resultBox.textContent = message;
    }

    async function startScanner() {
      const pin = pinInput.value.trim();

      if (!pin) {
        showResult('Введите PIN администратора', 'error');
        return;
      }
      if (isScanning || isSending) return;
