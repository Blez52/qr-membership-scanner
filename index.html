<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Membership — Сканер</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #182230;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; text-align: center; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #1769e0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #stopButton { background: #667085; }

    #reader {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #eef2f7;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
      font-size: 17px;
    }

    .success { background: #dcfce7 !important; color: #166534; }
    .error   { background: #fee2e2 !important; color: #991b1b; }

    .hint { color: #667085; font-size: 14px; line-height: 1.5; text-align: center; }
    .hint a { color: #1769e0; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="container">
    <h2>QR Membership</h2>

    <!-- Показывается только пока PIN не сохранён -->
    <div id="pinBlock">
      <p class="hint">Введите PIN администратора один раз — он запомнится на этом телефоне.</p>
      <input type="password" id="pin" placeholder="PIN администратора"
             inputmode="numeric" autocomplete="off">
    </div>

    <!-- Показывается, когда PIN сохранён -->
    <p id="pinSaved" class="hint hidden">
      PIN сохранён · <a href="#" onclick="changePin(); return false;">сменить</a>
    </p>

    <button id="startButton" onclick="startScanner()">Начать сканирование</button>
    <button id="stopButton" onclick="stopScanner()" disabled>Остановить камеру</button>

    <div id="reader"></div>

    <div id="result">Ожидание сканирования QR-кода</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxwwCjRbsbEEitckhPzRGmnJEu6DHvVb85anT2-hboTeaPLSKW4sIeYoNJ1ioy2R_h3/exec';

    let scanner = null;
    let isScanning = false;
    let isSending = false;

    const pinInput = document.getElementById('pin');
    const resultBox = document.getElementById('result');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    /* ---------- PIN: вводится один раз ---------- */

    function getSavedPin() {
      try { return localStorage.getItem('qr_pin') || ''; } catch (e) { return ''; }
    }

    function savePin(pin) {
      try { localStorage.setItem('qr_pin', pin); } catch (e) {}
    }

    function renderPin() {
      const has = !!getSavedPin();
      document.getElementById('pinBlock').classList.toggle('hidden', has);
      document.getElementById('pinSaved').classList.toggle('hidden', !has);
    }

    function changePin() {
      try { localStorage.removeItem('qr_pin'); } catch (e) {}
      pinInput.value = '';
      renderPin();
      pinInput.focus();
    }

    function currentPin() {
      return getSavedPin() || pinInput.value.trim();
    }

    renderPin();

    /* ---------- Сканер ---------- */

    function showResult(message, type) {
      resultBox.className = type || '';
      resultBox.textContent = message;
    }

    async function startScanner() {
      const pin = currentPin();

      if (!pin) {
        showResult('Введите PIN администратора', 'error');
        return;
      }
      if (isScanning || isSending) return;

      // Сохраняем PIN и прячем поле
      savePin(pin);
      renderPin();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showResult('Браузер не даёт доступ к камере. Откройте страницу в Safari по ссылке https://…', 'error');
        return;
      }

      try {
        showResult('Запрашиваем доступ к камере...', '');

        scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onQrScanned,
          () => {}
        );

        isScanning = true;
        startButton.disabled = true;
        stopButton.disabled = false;
        showResult('Камера работает. Наведите её на QR-код клиента.', '');

      } catch (error) {
        scanner = null;
        const msg = (error && (error.name || error.message)) || String(error);
        showResult('Не удалось запустить камеру: ' + msg +
                   '\nРазрешите доступ к камере: аА → Настройки веб-сайта → Камера.', 'error');
      }
    }

    async function stopScanner() {
      if (scanner && isScanning) {
        try { await scanner.stop(); } catch (e) {}
        try { scanner.clear(); } catch (e) {}
      }
      scanner = null;
      isScanning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    async function onQrScanned(decodedText) {
      if (isSending) return;
      isSending = true;

      await stopScanner();

      const token = String(decodedText || '').trim();
      const pin = currentPin();

      if (!token) {
        isSending = false;
        showResult('QR-код пустой', 'error');
        return;
      }

      showResult('Проверяем абонемент...', '');
      startButton.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: new URLSearchParams({ token: token, pin: pin })
        });

        const result = await response.json();

        if (result.success) {
          if (navigator.vibrate) navigator.vibrate(150);
          showResult(
            '✅ УСПЕШНО\n' +
            'Клиент: ' + result.name + '\n' +
            'Осталось занятий: ' + result.remaining + '\n' +
            'Статус: ' + result.status,
            'success'
          );
        } else if (result.error === 'Неверный PIN') {
          changePin(); // сбрасываем и снова показываем поле
          showResult('❌ Неверный PIN. Введите правильный и отсканируйте ещё раз.', 'error');
        } else {
          showResult(
            '❌ ОТКАЗ: ' + (result.error || 'Не удалось проверить абонемент') +
            (result.name ? '\nКлиент: ' + result.name : '') +
            (result.remaining !== undefined ? '\nОсталось занятий: ' + result.remaining : ''),
            'error'
          );
        }
      } catch (error) {
        showResult('Ошибка связи с сервером: ' + (error.message || error) +
                   '\nПроверьте интернет и попробуйте ещё раз.', 'error');
      } finally {
        isSending = false;
        startButton.disabled = false;
        startButton.textContent = 'Сканировать следующего';
      }
    }
  </script>
</body>
</html>
