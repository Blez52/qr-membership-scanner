<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPrimo</title>

  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BPrimo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#181818">

  <style>
    html, body { margin: 0; height: 100%; background: #181818; }

    #landing {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e8e8e8; font-family: Georgia, 'Times New Roman', serif; text-align: center;
      padding: 24px; box-sizing: border-box;
    }
    #landing img { width: 220px; height: 220px; border-radius: 28px; }
    a.btn {
      display: block; margin-top: 28px; padding: 16px 28px; border-radius: 12px;
      background: #b8433d; color: #fff; text-decoration: none;
      font-family: Arial, sans-serif; font-weight: bold; font-size: 18px;
    }
    p { color: #9a9a9a; font-family: Arial, sans-serif; font-size: 14px; max-width: 320px; line-height: 1.5; }

    #app {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%; border: 0;
      background: #f3f5f8;
    }
    body.app #landing { display: none; }
    body.app #app { display: block; }
  </style>
</head>
<body>
  <div id="landing">
    <img src="logo.png" alt="BPrimo Dance Studio">
    <a class="btn" href="app.html?launch=1">Открыть приложение</a>
    <p>
      Добавить иконку на экран:<br>
      iPhone — Safari → «Поделиться» → «На экран Домой».<br>
      Android — Chrome → ⋮ → «Добавить на главный экран».
    </p>
  </div>

  <iframe id="app" title="BPrimo Dance Studio" allow="camera; clipboard-write; web-share"></iframe>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxwwCjRbsbEEitckhPzRGmnJEu6DHvVb85anT2-hboTeaPLSKW4sIeYoNJ1ioy2R_h3/exec';

    const asApp =
      window.navigator.standalone === true ||
      new URLSearchParams(location.search).get('launch') === '1' ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (asApp) {
      document.body.classList.add('app');
      document.getElementById('app').src = APP_URL;
    }
  </script>
</body>
</html>
